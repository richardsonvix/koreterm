name: Release preflight
description: Validate signing and package-manager configuration.

inputs:
  version:
    description: Release version without a leading v.
    required: true
  prerelease:
    description: Whether the release is a prerelease.
    required: true
  require-package-managers:
    description: Whether WinGet and Scoop configuration is required.
    required: true
  github-token:
    description: GitHub token used for release configuration probes.
    required: true
  scoop-bucket-token:
    description: Scoop bucket token whose presence is validated by preflight.
    required: true
  wingetcreate-token:
    description: WinGetCreate token whose presence is validated by preflight.
    required: true

runs:
  using: composite
  steps:
    - name: Validate release configuration
      shell: pwsh
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        SCOOP_BUCKET_TOKEN: ${{ inputs.scoop-bucket-token }}
        WINGETCREATE_TOKEN: ${{ inputs.wingetcreate-token }}
        RELEASE_VERSION: ${{ inputs.version }}
        RELEASE_PRERELEASE: ${{ inputs.prerelease }}
        REQUIRE_PACKAGE_MANAGERS: ${{ inputs.require-package-managers }}
      run: |
        $preflightArgs = @{
          Version = $env:RELEASE_VERSION
          RequireSigning = $true
          RequirePackageManagers = $env:REQUIRE_PACKAGE_MANAGERS -eq 'true'
        }
        ./scripts/release-preflight.ps1 @preflightArgs
